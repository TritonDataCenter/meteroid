name: 'Rust Setup'
description: 'Setup Rust toolchain with dependencies, caching, and mold linker'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    default: '1.96.0'
  components:
    description: 'Rust components to install (comma-separated)'
    default: ''
  install-deps:
    description: 'Install system dependencies (protoc, cmake, etc.)'
    default: 'true'
  mold:
    description: 'Use mold linker'
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang unzip libsasl2-dev
        wget -q https://github.com/protocolbuffers/protobuf/releases/download/v21.8/protoc-21.8-linux-x86_64.zip
        unzip -q protoc*.zip
        sudo mv bin/protoc /usr/local/bin
        # cp, not mv: a self-hosted runner keeps /usr/local/include/google from
        # the previous job, and mv refuses to replace a non-empty directory.
        sudo cp -r include/google /usr/local/include/
        rm -rf protoc*.zip bin include readme.txt

    # make-default replaces the system /usr/bin/ld with mold. That is fine on a
    # throwaway GitHub-hosted VM, but a self-hosted runner keeps it for every
    # later job, including other repos' builds, so there mold is installed
    # without taking over ld.
    - name: Setup mold linker
      if: inputs.mold == 'true'
      uses: rui314/setup-mold@v1
      with:
        make-default: ${{ runner.environment == 'github-hosted' }}

    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        # Only write the cache from main so PR/dependabot branches restore
        # main's warm dependency cache instead of evicting it. This is the fix
        # for the 10GB GHA cache thrashing that caused cold compiles every run.
        save-if: ${{ github.ref == 'refs/heads/main' }}
