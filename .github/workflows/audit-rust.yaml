name: Audit Rust Dependencies

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-rust.yaml"
      - ".github/actions/rust-setup/**"
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - ".github/workflows/audit-rust.yaml"
      - ".github/actions/rust-setup/**"
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    # Pull requests from forks stay on GitHub-hosted runners: the repo is
    # public, and self-hosted runners must not run untrusted code.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"triton","labels":["self-hosted","APP"]}') || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          install-deps: 'false'

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
