name: CI Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/ci-ui.yaml"
      - "modules/meteroid/proto/**"
      - "modules/web/**"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    # Pull requests from forks stay on GitHub-hosted runners: the repo is
    # public, and self-hosted runners must not run untrusted code.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"triton","labels":["self-hosted","APP"]}') || 'ubuntu-latest' }}
    name: Lint
    env:
      TURBO_TELEMETRY_DISABLED: true
    steps:
      - uses: actions/checkout@v7
      # pnpm's self-installer needs Node 20.11+, and some runners ship 18.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.6.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "modules/web/pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --prefix modules/web
      - name: Run lint
        run: pnpm --prefix modules/web lint
